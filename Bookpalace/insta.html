<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *   { margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      box-sizing: border-box;}

body    {background:whitesmoke;}

.login  {background: #ffffff;
         padding: 30px 120px;
         width: 550px;
         position: absolute;
         top: 50%;
         left: 50%;
         transform: translate(-50%,-50%);
         text-align: center;
         border-radius: 10px;}

.logo   {width: 30px;
         margin-bottom: 20px;}

.login button i {width: 18px;
                 margin-right: 10px;}

.login button   {width: 100%;
                 padding: 10px 0;
                 display: flex;
                 align-items: center;
                 justify-content: center;
                 margin: 20px 0;
                 border-radius: 30px;
                 background: transparent;
                 border: 1px solid #999;
                 font-weight: 500;
                 cursor: pointer;}

.login hr   {border: 0;
             height: 1px;
             background: #c2c2c2;
             margin: 5px;}

.login span {display: block;
             margin: auto;
             width: 40px;
             background: #fff;
             font-size: 14px;
             margin-top: -16px;}

.login input    {width: 100%;
                 background: transparent;
                 border: 1px solid #999;
                 outline: 0;
                 padding: 15px 10px;
                 border-radius: 5px;
                 margin: 10px 0;}

::placeholder {font-weight: 500;
                color: #333;}

.login form button  {background: #000;
                     color: #fff;
                     border: 0;
                     margin-bottom: 15px;}

.login p    {text-align: left;
             font-size: 14px;
             color: #555;
             margin: 40px 0 50px;}

.login p a { text-decoration: none;
             color: #359cf0;}            

    </style>
    <link rel="stylesheet" href="../assets/css/page-transitions.css?v=20261101-smooth2">
    <script defer src="../assets/js/page-transitions.js?v=20261101-smooth2"></script>
</head>
<body>
    <div class="login">
        <i class="fa-brands fa-instagram" style="font-size:40px" class="logo"></i>
        <hr>
        <form>
            <input type="text" placeholder="Phone,email or usename">
            <input type="password" placeholder="Password">
            <button type="submit">Next</button>
        </form>
            <button>Forgot password?</button>
            <p>Don't have an account?<a href="#">Sing up</a></p>
    </div>
</body>
</html>
